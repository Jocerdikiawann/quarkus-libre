contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub

  repositories:
    - https://apk.cgr.dev/chainguard

  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - openjdk-25-jre

accounts:
  groups:
    - groupname: nonroot
      gid: 65532

  users:
    - username: nonroot
      uid: 65532
      gid: 65532

  run-as: nonroot

work-dir: /app

environment:
  HOME: /tmp
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=75.0
    -Djava.awt.headless=true

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

  - path: /tmp
    type: directory
    permissions: 0o1777

entrypoint:
  command: /usr/lib/jvm/java-25-openjdk/bin/java

cmd: --version

archs:
  - x86_64
