
name: Wolfi Java 25 Distroless

on:
  push:
    branches: [main]
    paths:
      - 'apko.yaml'
      - '.github/workflows/distroless.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: wolfi-jdk-distroless
  cancel-in-progress: false

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Before production, pin these tools to tested release versions.
      - name: Install apko and crane
        shell: bash
        run: |
          set -euo pipefail
          go install chainguard.dev/apko@latest
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build image with apko
        shell: bash
        run: |
          set -euo pipefail
          apko build apko.yaml wolfi-jdk-distroless:ci image.tar --arch x86_64
          docker load -i image.tar
          docker image inspect wolfi-jdk-distroless:ci-amd64 >/dev/null

      - name: Java smoke test
        run: docker run --rm wolfi-jdk-distroless:ci-amd64

      - name: Verify non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          USER_ID="$(docker image inspect wolfi-jdk-distroless:ci-amd64 --format '{{.Config.User}}')"
          test "$USER_ID" = '65532' || test "$USER_ID" = 'nonroot'
          echo "Runtime user: $USER_ID"

      - name: Scan all known vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wolfi-jdk-distroless:ci-amd64
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: wolfi-jdk-distroless:ci-amd64
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-jdk-distroless-sbom
          path: sbom.spdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Compare local and remote image
        id: compare
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${OWNER,,}/wolfi-jdk-distroless"
          LOCAL_IMAGE="wolfi-jdk-distroless:ci-amd64"

          LOCAL_ID=$(docker image inspect "$LOCAL_IMAGE" \
            --format '{{.Id}}')

          echo "Local image ID: $LOCAL_ID"

          if docker manifest inspect "$IMAGE:latest" \
            >/dev/null 2>&1; then

            docker pull "$IMAGE:latest"

            REMOTE_ID=$(docker image inspect "$IMAGE:latest" \
              --format '{{.Id}}')

            echo "Remote image ID: $REMOTE_ID"

            if [[ "$LOCAL_ID" == "$REMOTE_ID" ]]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Image unchanged. Skipping publish."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Image changed. Publishing required."
            fi

            echo "remote_exists=true" >> "$GITHUB_OUTPUT"

          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Remote image not found. First publish required."
            echo "remote_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Generate previous image SBOM
        if: steps.compare.outputs.remote_exists == 'true' && steps.compare.outputs.changed == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.compare.outputs.image }}:latest
          format: spdx-json
          output-file: previous.spdx.json
          upload-artifact: false

      - name: Compare package versions
        if: steps.compare.outputs.remote_exists == 'true' && steps.compare.outputs.changed == 'true'
        run: |
          python3 compare_sbom.py \
            previous.spdx.json \
            sbom.spdx.json

          cat package-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package change report
        if: steps.compare.outputs.remote_exists == 'true' && steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-package-changes
          path: package-report.md
          retention-days: 30

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Check Cosign
        run: cosign version

      - name: Publish changed image
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.compare.outputs.image }}
        run: |
          set -euo pipefail
          docker tag wolfi-jdk-distroless:ci-amd64 "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:latest"

      - name: Sign image
        shell: bash
        env:
          IMAGE: ${{ steps.compare.outputs.image }}
        run: |
          set -euo pipefail

          DIGEST=$(crane digest "$IMAGE:latest")

          REF="$IMAGE@$DIGEST"

          echo "Signing image: $REF"

          cosign sign --yes "$REF"

      - name: Verify image signature
        shell: bash
        env:
          IMAGE: ${{ steps.compare.outputs.image }}
        run: |
          set -euo pipefail

          DIGEST=$(crane digest "$IMAGE:latest")

          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/distroless.yml@${GITHUB_REF}"

          cosign verify \
            "$IMAGE@$DIGEST" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com"
