name: Wolfi Java 25 Distroless

on:
  push:
    branches: [main]
    paths:
      - apko.yaml
      - compare_sbom.py
      - .github/workflows/java25-distroless.yml
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional immutable release tag (for example v1.0.0)'
        required: false
        type: string

concurrency:
  group: wolfi-jdk-distroless-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-scan-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      SYFT_IMAGE: anchore/syft:v1.56.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install apko and crane
        shell: bash
        run: |
          set -euo pipefail
          go install chainguard.dev/apko@latest
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build both platforms with apko
        shell: bash
        run: |
          set -euo pipefail
          apko build apko.yaml wolfi-jdk-distroless:ci amd64.tar --arch x86_64
          apko build apko.yaml wolfi-jdk-distroless:ci arm64.tar --arch aarch64
          docker load -i amd64.tar
          docker load -i arm64.tar
          docker image inspect wolfi-jdk-distroless:ci-amd64 >/dev/null
          docker image inspect wolfi-jdk-distroless:ci-arm64 >/dev/null

      - name: Smoke test and non-root checks
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            ref="wolfi-jdk-distroless:ci-${arch}"
            echo "Testing $ref"
            test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$arch"
            uid="$(docker image inspect "$ref" --format '{{.Config.User}}')"
            [[ "$uid" == '65532' || "$uid" == 'nonroot' ]]
            docker run --rm --platform "linux/$arch" "$ref"
          done

      - name: Scan AMD64 vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wolfi-jdk-distroless:ci-amd64
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Scan ARM64 vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: wolfi-jdk-distroless:ci-arm64
          scan-type: image
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Generate per-platform SPDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace" -w /workspace \
              "$SYFT_IMAGE" \
              "docker:wolfi-jdk-distroless:ci-${arch}" \
              -o "spdx-json=/workspace/sbom-${arch}.spdx.json"
            jq -e '.packages | type == "array"' "sbom-${arch}.spdx.json" >/dev/null
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wolfi-java25-sboms
          path: sbom-*.spdx.json
          retention-days: 30
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare both platforms with GHCR
        id: compare
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER,,}/wolfi-jdk-distroless"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          if crane digest "$IMAGE:latest" > remote-digest.txt 2> remote-error.txt; then
            echo 'remote_exists=true' >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'MANIFEST_UNKNOWN|NAME_UNKNOWN|404|not found' remote-error.txt; then
            echo 'remote_exists=false' >> "$GITHUB_OUTPUT"
            echo 'remote_multi=false' >> "$GITHUB_OUTPUT"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'No existing latest image: first publish required.'
            exit 0
          else
            cat remote-error.txt >&2
            exit 1
          fi

          remote_index="$(crane manifest "$IMAGE:latest")"
          if ! jq -e '
            (.manifests // []) as $m
            | (["amd64", "arm64"] | all(. as $a |
                any($m[]; .platform.os == "linux" and .platform.architecture == $a)))
          ' <<< "$remote_index" >/dev/null; then
            echo 'remote_multi=false' >> "$GITHUB_OUTPUT"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Remote image is not yet a complete amd64+arm64 index.'
            exit 0
          fi

          changed=false
          remote_multi=true
          for arch in amd64 arm64; do
            local_id="$(docker image inspect "wolfi-jdk-distroless:ci-${arch}" --format '{{.Id}}')"
            if remote_manifest="$(crane manifest --platform "linux/$arch" "$IMAGE:latest" 2> "remote-${arch}-error.txt")"; then
              remote_id="$(jq -er '.config.digest' <<< "$remote_manifest")"
              echo "$arch: local=$local_id remote=$remote_id"
              if [[ "$local_id" != "$remote_id" ]]; then
                changed=true
              fi
            elif grep -Eiq 'no child|no matching|not found|MANIFEST_UNKNOWN|404|platform' "remote-${arch}-error.txt"; then
              echo "$arch: platform missing in remote image"
              remote_multi=false
              changed=true
            else
              cat "remote-${arch}-error.txt" >&2
              exit 1
            fi
          done
          echo "remote_multi=$remote_multi" >> "$GITHUB_OUTPUT"
